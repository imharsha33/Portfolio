<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Harsha Vardhan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .logo span {
            color: #FF5722;
        }

        nav ul {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #FF5722;
            transition: width 0.3s;
        }

        nav ul li a:hover {
            color: #FF5722;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        nav ul li a.active {
            color: #FF5722;
        }

        nav ul li a.active::after {
            width: 100%;
        }

        .nav-btn {
            background: #FF5722;
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 87, 34, 0.5);
        }

        /* Projects Section */
        .projects-section {
            min-height: 100vh;
            padding: 120px 5% 80px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .section-title h1 span {
            color: #FF5722;
        }

        .section-title p {
            font-size: 1.2rem;
            color: #b0b0b0;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 3rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .project-card {
            background: linear-gradient(135deg, rgba(255, 87, 34, 0.05), rgba(255, 193, 7, 0.02));
            border-radius: 20px;
            border: 2px solid rgba(255, 87, 34, 0.2);
            overflow: hidden;
            transition: all 0.4s;
            position: relative;
            cursor: pointer;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #FF5722, #FFC107);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s;
        }

        .project-card:hover::before {
            transform: scaleX(1);
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: #FF5722;
            box-shadow: 0 20px 60px rgba(255, 87, 34, 0.3);
        }

        .project-header {
            padding: 2.5rem 2.5rem 1.5rem;
            position: relative;
        }

        .project-icon {
            width: 70px;
            height: 70px;
            background: rgba(255, 87, 34, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            transition: all 0.4s;
        }

        .project-card:hover .project-icon {
            background: #FF5722;
            transform: scale(1.1) rotate(5deg);
        }

        .project-icon svg {
            width: 35px;
            height: 35px;
            fill: #FF5722;
            transition: fill 0.4s;
        }

        .project-card:hover .project-icon svg {
            fill: #fff;
        }

        .project-header h3 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: #fff;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            padding: 0.3rem 0.8rem;
            background: rgba(255, 87, 34, 0.1);
            border: 1px solid rgba(255, 87, 34, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #FF5722;
        }

        .project-body {
            padding: 0 2.5rem 2.5rem;
        }

        .project-description {
            font-size: 1rem;
            line-height: 1.8;
            color: #b0b0b0;
            margin-bottom: 2rem;
        }

        .project-stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 87, 34, 0.2);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #b0b0b0;
        }

        .stat svg {
            width: 18px;
            height: 18px;
            fill: #FF5722;
        }

        .project-links {
            display: flex;
            gap: 1rem;
        }

        .project-btn {
            flex: 1;
            padding: 0.9rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: #FF5722;
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 87, 34, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #FF5722;
            border: 2px solid rgba(255, 87, 34, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(255, 87, 34, 0.1);
            border-color: #FF5722;
        }

        .project-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Featured Badge */
        .featured-badge {
            position: absolute;
            top: 2.5rem;
            right: 2.5rem;
            background: linear-gradient(135deg, #FF5722, #FFC107);
            color: #fff;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Scroll to Top Button */
        .scroll-top {
            position: fixed;
            bottom: 3rem;
            right: 3rem;
            width: 60px;
            height: 60px;
            background: #FF5722;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 999;
            opacity: 0;
            transition: all 0.3s;
        }

        .scroll-top.show {
            opacity: 1;
        }

        .scroll-top:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 87, 34, 0.5);
        }

        /* Mobile Menu */
        .mobile-menu {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            cursor: pointer;
        }

        .mobile-menu span {
            width: 30px;
            height: 3px;
            background: #fff;
            transition: all 0.3s;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .section-title h1 {
                font-size: 2.5rem;
            }

            .projects-grid {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            }
        }

        @media (max-width: 768px) {
            nav ul {
                display: none;
            }

            .mobile-menu {
                display: flex;
            }

            .mobile-menu.active span:nth-child(1) {
                transform: rotate(45deg) translate(8px, 8px);
            }

            .mobile-menu.active span:nth-child(2) {
                opacity: 0;
            }

            .mobile-menu.active span:nth-child(3) {
                transform: rotate(-45deg) translate(7px, -7px);
            }

            nav ul {
                position: fixed;
                top: 80px;
                left: -100%;
                flex-direction: column;
                background: rgba(10, 10, 10, 0.98);
                width: 100%;
                padding: 2rem;
                gap: 2rem;
                transition: left 0.3s;
            }

            nav ul.active {
                left: 0;
                display: flex;
            }

            .section-title h1 {
                font-size: 2rem;
            }

            .section-title p {
                font-size: 1rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .project-header,
            .project-body {
                padding: 2rem;
            }

            .project-header h3 {
                font-size: 1.5rem;
            }

            .project-links {
                flex-direction: column;
            }

            .scroll-top {
                bottom: 2rem;
                right: 2rem;
                width: 50px;
                height: 50px;
            }

            .featured-badge {
                top: 2rem;
                right: 2rem;
            }
        }

        /* Loading Animation */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }

        .loader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 87, 34, 0.2);
            border-top-color: #FF5722;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Loading Animation -->
    <div class="loader">
        <div class="spinner"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="logo">Harsha <span>Vardhan</span></div>
        <ul id="navMenu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="projects.html" class="active">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="contact.html" class="nav-btn">Contact Me</a>
        <div class="mobile-menu" id="mobileMenu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- Projects Section -->
    <section class="projects-section">
        <div class="section-title">
            <h1>My <span>Projects</span></h1>
            <p>
                Explore my collection of web development, AI/ML, and game development projects. Each project represents
                my journey of learning, experimentation, and real-world problem-solving.
            </p>
        </div>

        <div class="projects-grid" id="projectsGrid">
            <!-- Projects will be loaded dynamically here via JavaScript -->
        </div>
    </section>

    <!-- Scroll to Top Button -->
    <div class="scroll-top" id="scrollTop">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
    </div>

    <script>
        // Loading Animation
        window.addEventListener('load', function () {
            setTimeout(function () {
                document.querySelector('.loader').classList.add('hide');
            }, 500);
        });

        // Mobile Menu
        const mobileMenu = document.getElementById('mobileMenu');
        const navMenu = document.getElementById('navMenu');

        if (mobileMenu && navMenu) {
            mobileMenu.addEventListener('click', function () {
                mobileMenu.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            // Close mobile menu when clicking on a link
            navMenu.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () {
                    mobileMenu.classList.remove('active');
                    navMenu.classList.remove('active');
                });
            });
        }

        // Scroll to Top Button
        const scrollTop = document.getElementById('scrollTop');

        if (scrollTop) {
            window.addEventListener('scroll', function () {
                if (window.pageYOffset > 300) {
                    scrollTop.classList.add('show');
                } else {
                    scrollTop.classList.remove('show');
                }
            });

            scrollTop.addEventListener('click', function () {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }

        // Stagger animation setup
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry, index) {
                if (entry.isIntersecting) {
                    setTimeout(function () {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }, index * 100);
                }
            });
        }, observerOptions);

        // Fetch GitHub Projects
        async function fetchGitHubProjects() {
            const grid = document.getElementById('projectsGrid');
            if (!grid) return;

            try {
                // Fetch from your github
                const response = await fetch('https://api.github.com/users/imharsha33/repos?per_page=100&sort=updated');
                const repos = await response.json();
                
                const customDescriptions = {
                    "Bujji": "An intelligent virtual assistant designed for comprehensive task management and information retrieval.",
                    "BUJJI-BOT": "A robust chatbot application focusing on automated user interactions and support.",
                    "Bujji-Chatbot": "An AI-powered conversational agent providing intelligent responses. Includes an Android app.",
                    "CMS-JAVA": "A robust Content Management System built with Java for efficient data handling.",
                    "EARTH-TWIN": "A web application simulating or exploring planetary environmental data.",
                    "EndlessRunner": "A fast-paced endless runner game with engaging mechanics and high-score tracking.",
                    "FreshGuard": "An application aimed at monitoring food freshness or managing inventory efficiently.",
                    "geobuild-AI": "An AI-driven platform for geographic data analysis and structural planning.",
                    "Home-Interior": "A visualization tool for interior design and home decor planning.",
                    "Medi-Sync": "A healthcare management system synchronizing patient data and medical records.",
                    "Portfolio": "My personal portfolio website showcasing my skills, projects, and professional journey.",
                    "QR.Zip.Share": "A utility for compressing files and sharing them securely via QR codes.",
                    "Research-Notebook-Structurer": "A tool designed to help researchers organize and structure their notes efficiently.",
                    "SkillBridge": "A platform connecting individuals with opportunities to learn and develop new skills.",
                    "SkillGapAnalyser": "An analytical tool to assess and bridge the gap between current and required skills.",
                    "WoundWise": "A medical application focusing on wound analysis and healthcare tracking."
                };

                let html = '';
                repos.forEach(repo => {
                    const date = new Date(repo.updated_at).getFullYear();
                    const language = repo.language || 'Code';
                    
                    if (repo.name === 'imharsha33') return;
                    
                    let homepageBtn = '';
                    if (repo.homepage && repo.homepage !== '') {
                        homepageBtn = `
                        <a href="${repo.homepage}" target="_blank" class="project-btn btn-secondary">
                            <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                            Live Demo
                        </a>`;
                    }
                    
                    let apkBtn = '';
                    if (repo.name.toLowerCase() === 'bujji-chatbot') {
                        apkBtn = `
                        <a href="bujji-debug.apk" download class="project-btn btn-secondary" style="background: rgba(76, 175, 80, 0.1); border-color: #4CAF50; color: #4CAF50;">
                            <svg viewBox="0 0 24 24" style="fill: #4CAF50;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                            Download APK
                        </a>`;
                    }
                    
                    let tagsHtml = '';
                    if (repo.language) tagsHtml += `<span class="tag">${repo.language}</span>`;
                    if (repo.topics) {
                        repo.topics.forEach(t => {
                            tagsHtml += `<span class="tag">${t}</span>`;
                        });
                    }

                    const projectDesc = customDescriptions[repo.name] || repo.description || 'No description provided.';

                    html += `
            <div class="project-card">
                <div class="project-header">
                    <div class="project-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
                        </svg>
                    </div>
                    <h3>${repo.name}</h3>
                    <div class="project-tags">
                        ${tagsHtml}
                    </div>
                </div>
                <div class="project-body">
                    <p class="project-description">
                        ${projectDesc}
                    </p>
                    <div class="project-stats">
                        <div class="stat">
                            <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/></svg>
                            <span>${language}</span>
                        </div>
                        <div class="stat">
                            <svg viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
                            <span>${date}</span>
                        </div>
                    </div>
                    <div class="project-links">
                        <a href="${repo.html_url}" target="_blank" class="project-btn btn-primary">
                            <svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                            View Code
                        </a>
                        ${homepageBtn}
                        ${apkBtn}
                    </div>
                </div>
            </div>`;
                });
                
                grid.innerHTML = html;
                
                // Re-initialize animations
                const newCards = document.querySelectorAll('.project-card');
                newCards.forEach((card) => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(30px)';
                    card.style.transition = 'all 0.6s ease-out';
                    observer.observe(card);
                });

            } catch (error) {
                console.error('Error fetching projects:', error);
                grid.innerHTML = '<p style="text-align:center;width:100%;">Failed to load projects. Please try again later.</p>';
            }
        }

        // Call the function
        fetchGitHubProjects();
    </script>
</body>

</html>
